<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
  <defs>
    <style>
      @keyframes typing1 {
        0% { width: 0; }
        100% { width: 100%; }
      }
      @keyframes blink {
        0%, 49% { border-color: transparent; }
        50%, 100% { border-color: #1f6feb; }
      }
      .line1 {
        font-family: 'Courier New', monospace;
        font-size: 56px;
        font-weight: bold;
        color: #1f6feb;
        overflow: hidden;
        white-space: nowrap;
        animation: typing1 2s steps(20, end) forwards;
      }
      .line2 {
        font-family: 'Courier New', monospace;
        font-size: 42px;
        color: #58a6ff;
        overflow: hidden;
        white-space: nowrap;
        animation: typing1 3s steps(35, end) 2s forwards;
        opacity: 0;
      }
      .line3 {
        font-family: 'Courier New', monospace;
        font-size: 42px;
        color: #79c0ff;
        overflow: hidden;
        white-space: nowrap;
        animation: typing1 2.5s steps(30, end) 5s forwards;
        opacity: 0;
      }
      .cursor {
        animation: blink 0.75s step-end infinite;
        border-right: 3px solid #1f6feb;
        display: inline-block;
      }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="400" fill="#0d1117" rx="15"/>
  
  <!-- Decorative border -->
  <rect width="1000" height="400" fill="none" stroke="#30363d" stroke-width="2" rx="15"/>
  
  <!-- Line 1: Hi, I'm incrediblemohnish5 -->
  <text x="50" y="100" class="line1">Hi, I'm incrediblemohnish5<span class="cursor"></span></text>
  
  <!-- Line 2: Developer & Tech Enthusiast -->
  <text x="50" y="170" class="line2">Developer | Tech Enthusiast | Open Source<span class="cursor"></span></text>
  
  <!-- Line 3: Building cool projects... -->
  <text x="50" y="240" class="line3">Building cool projects with code 🚀<span class="cursor"></span></text>
  
  <!-- Decorative elements -->
  <circle cx="900" cy="80" r="4" fill="#1f6feb" opacity="0.5"/>
  <circle cx="920" cy="100" r="3" fill="#58a6ff" opacity="0.4"/>
  <circle cx="880" cy="120" r="3" fill="#79c0ff" opacity="0.3"/>
</svg>